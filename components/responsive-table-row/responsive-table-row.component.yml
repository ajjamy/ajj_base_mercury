$schema: "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Responsive Table Row
group: Base
status: stable
description: >-
  One row of a Responsive Table. Place only inside a Responsive Table's Rows
  slot. Cells line up with the table's column headers in order.
props:
  type: object
  properties:
    label:
      type: string
      title: Row label
      description: Optional row header shown in the first column (and as the card title on mobile). Use it on every row or none so columns stay aligned.
      examples:
        - Add Row Header
    cells:
      type: array
      title: Cells
      description: One value per remaining column, in header order.
      items:
        type: string
      examples:
        - ["$10", "Lorenm ipsum dolor"]
