"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Testimonial card
group: Card
props:
  type: object
  required:
    - align
    - style
  properties:
    text:
      type: string
      title: Quote text
      pattern: "(.|\\r?\\n)*"
      examples:
        - "Lorem ipsum dolor sit amet. Ea explicabo exercitationem et delectus quia quo exercitationem praesentium eos odit sunt. Eos voluptatibus voluptatem eos eius reiciendis eum laboriosam quia ex sapiente velit aut libero voluptatem ad voluptas praesentium."
    cite_name:
      type: string
      title: Citation name
      examples:
        - "Someone Somewhere, NP"
    cite_text:
      type: string
      title: Citation text
      examples:
        - "Optional, Job Title, Employer, etc."
    cite_url:
      type: string
      title: Citation link
      format: uri-reference
    align:
      type: string
      title: Alignment
      enum:
        - center
        - left
      default: center
      examples:
        - center
    style:
      type: string
      title: Style
      enum:
        - default
        - inverted
      meta:enum:
        default: Default
        inverted: Inverted
      default: default
      examples:
        - default
    media:
      $ref: json-schema-definitions://canvas.module/image
      title: Image
      type: object
      examples:
        - src: "assets/placeholder.jpg"
          alt: "Placeholder"
          width: 100
          height: 100
