"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Badge
group: Base
status: stable
props:
  type: object
  required:
    - label
    - style
  properties:
    label:
      type: string
      title: Link text
      examples:
        - Badge text
    url:
      type: string
      title: Link
      format: uri-reference
    open_in_new_tab:
      type: boolean
      title: Open link in a new tab
      description: Check if the link is external and should open in a new tab.
      default: false
    style:
      type: string
      title: Style
      enum:
        - primary
        - primary-outline
        - secondary
        - accent
        - accent-warm
      meta:enum:
        primary: Primary
        primary-outline: Outline
        secondary: Secondary
        accent: Accent
        accent-warm: Accent Warm
      examples:
        - primary
    icon:
      type: string
      title: Icon name
      description: 'The ID of an icon from the <a href="https://phosphoricons.com/" target="_blank">Phosphor Icons</a> library.'
    icon_first:
      type: boolean
      title: Icon first
      default: true
      examples:
        - true
