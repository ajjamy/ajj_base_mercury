$schema: "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Button
group: Base
status: stable
props:
  type: object
  required:
    - variant
    - size
  properties:
    variant:
      type: string
      title: Style
      enum:
        - primary
        - primary-inverted
        - primary-underline
        - secondary
        - secondary-inverted
        - accent-warm
        - accent-warm-inverted
      meta:enum:
        primary: Primary (Dark Blue)
        primary-inverted: Primary inverted
        primary-underline: Primary Underline
        secondary: Accent (Light Blue)
        secondary-inverted: Accent inverted
        accent-warm: Accent Warm (Orange)
        accent-warm-inverted: Accent Warm (Inverted)
      examples:
        - primary
    label:
      type: string
      title: Label
      default: "Button label"
      examples:
        - "Button label"
    sr_text:
      type: string
      title: Additional screen reader text
      description: "Read by screen readers after the label but not shown on screen, e.g. 'about our services'."
      examples:
        - "about our services"
    href:
      type: string
      title: Link
      format: uri-reference
    size:
      type: string
      title: Button size
      enum:
        - small
        - medium
        - large
      meta:enum:
        small: Small
        medium: Medium
        large: Large
      examples:
        - medium
    icon:
      type: string
      title: Icon
      enum:
        - arrow-right
        - arrow-left
        - caret-right
        - caret-left
        - download
        - user-plus
      meta:enum:
        arrow-right: Arrow right
        arrow-left: Arrow left
        caret-right: Caret right
        caret-left: Caret left
        download: Download
        user-plus: User plus
      examples:
        - arrow-right
    mobile_width:
      type: boolean
      title: Full width on mobile
      default: false
    icon_first:
      type: boolean
      title: Display icon first
      default: false
      examples:
        - false
    disabled:
      type: boolean
      title: Disabled
      default: false
      examples:
        - false
        - true
