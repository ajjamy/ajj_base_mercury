$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Number card
description: A card that highlights a number or short text (such as a statistic) above a heading and description.
group: Card
props:
  type: object
  required:
    - text_align
    - number_align
  properties:
    number:
      type: string
      title: Number
      description: "A number or short text to feature, for example 1M+, 98% or 24/7."
      examples:
        - "1M+"
    text:
      type: string
      title: Heading
      examples:
        - Your heading here
    description:
      type: string
      title: Description
      contentMediaType: text/html
      x-formatting-context: block
      examples:
        - "<p>This is placeholder text.</p>"
    text_align:
      type: string
      title: Text alignment
      enum:
        - left
        - center
        - right
      meta:enum:
        left: Left
        center: Center
        right: Right
      default: center
      examples:
        - center
    tile_size:
      type: string
      title: Aspect ratio
      enum:
        - square
        - "4:3"
        - "16:9"
      meta:enum:
        square: Square
        "4:3": Rectangle 4 × 3
        "16:9": Rectangle 16 × 9
    background_color:
      type: string
      title: Background color
      enum:
        - primary
        - secondary
        - accent
        - muted
        - background
      meta:enum:
        primary: Primary
        secondary: Secondary
        accent: Accent
        muted: Muted
        background: Background
    border_radius:
      type: string
      title: Border radius
      enum:
        - small
        - medium
        - large
      meta:enum:
        small: Small
        medium: Medium
        large: Large
      default: medium
      examples:
        - small
    number_size:
      type: string
      title: Number size
      enum:
        - small
        - medium
        - large
        - extra-large
      meta:enum:
        small: Small
        medium: Medium
        large: Large
        extra-large: Extra large
      examples:
        - large
    number_align:
      type: string
      title: Number alignment
      enum:
        - left
        - right
        - center
      meta:enum:
        left: Left
        center: Center
        right: Right
      default: center
      examples:
        - center
    number_style:
      type: string
      title: Number style
      enum:
        - primary
        - primary_background
        - secondary_background
      meta:enum:
        primary: Primary
        primary_background: Primary with background
        secondary_background: Secondary with background
    url:
      type: string
      title: Link
      format: uri-reference
