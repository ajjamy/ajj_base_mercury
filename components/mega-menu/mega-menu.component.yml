$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Mega menu
description: Level 1 navigation list with optional multi-column dropdown content.
group: Navigation
props:
  type: object
  properties:
    items:
      type: array
      title: Top-level menu items
      default: []
      items:
        type: object
        required:
          - label
        properties:
          id:
            type: string
            title: Unique item ID
          label:
            type: string
            title: Link label
          href:
            type: string
            title: Link URL
            format: uri-reference
          variant:
            type: string
            title: Dropdown variant
            enum:
              - mega
              - simple
            default: mega
          featured_position:
            type: string
            title: Featured content position
            enum:
              - left
              - right
            default: right
          mobile_only:
            type: boolean
            title: Only show below the nav breakpoint
            default: false
          columns:
            type: array
            title: Dropdown columns
            items:
              type: object
              properties:
                heading:
                  type: string
                  title: Column heading
                  mobile_only:
                    type: boolean
                    title: Only show below the nav breakpoint
                    default: false
                links:
                  type: array
                  title: Column links
                  items:
                    type: object
                    required:
                      - label
                      - href
                    properties:
                      label:
                        type: string
                        title: Link label
                      href:
                        type: string
                        title: Link URL
                        format: uri-reference
                      mobile_only:
                        type: boolean
                        title: Only show below the nav breakpoint
                        default: false

slots:
  menu_content:
    title: Additional menu content

libraryOverrides:
  js:
    mega-menu.js:
      attributes:
        type: module
